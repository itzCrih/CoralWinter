name: CoralWinter
version: '${project.version}'
main: it.itzcrih.coralwinter.CoralWinter
authors: [itzCrih]
description: CoralMC Snowball fight replica
softdepend: [ProtocolLib]
commands:
  coralwinter:
    description: CoralWinter main command
    usage: /coralwinter <sub-command>
    aliases: [ cw ]
permissions:
  coralwinter.command.help:
    description: Allows the player to get the only-admin help message
    default: op
  coralwinter.command.santashovel:
    description: Allows the player to use the santashovel command
    default: op
  coralwinter.command.reload:
    description: Allows the player to reload configurations
    default: op
  coralwinter.command.snow:
    description: Allows the player to use the snowfall command.
    default: op
  coralwinter.command.addsnow:
    default: op
  coralwinter.command.version:
    default: op